name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Feature self-test (every conversion and tool)
        run: swift run -c release dropwheel-selftest
      - name: Build universal app, zip and DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || VERSION="0.0.0-dev"
          UNIVERSAL=1 ./scripts/build-app.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: DropWheel
          path: dist/*.dmg
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/DropWheel.dmg
            dist/DropWheel.zip
            dist/DropWheel-*.dmg
